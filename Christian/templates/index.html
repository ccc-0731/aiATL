<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body.lightmode {
            background: linear-gradient(to bottom, #87ceeb, #ffffff) no-repeat center center fixed; /* Sky blue to white gradient */
            background-size: cover;
            color: #333;
            font-family: 'Arial', sans-serif;
        }

        body.darkmode {
            background: linear-gradient(to bottom, #87ceeb, #ffffff) no-repeat center center fixed; /* Sky blue to white gradient */
            background-size: cover;
            color: #333;
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 5%;
            background: rgba(248, 250, 210, 0.9); 
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1, h2 {
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            text-align: center;
        }
        h1 {
            color: #fbb034; /* Golden retriever fur-inspired orange */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        h2 {
            color: #228b22; /* Deep green to evoke nature */
        }
        
        .btn-custom {
            background-color: #fbb034;
            border: none;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #ffa72b;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-secondary {
            background-color: #228b22;
            border: none;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task List</h1>
        <h2>Welcome back, username!</h2>
        <form action="/upload_image" method="POST" class="mt-4">
            <div class="mb-3">
                <label for="image_input" class="form-label">Upload Image:</label>
                <input id="image_input" type="file" name="image_input" class="form-control" accept="image/*" capture="camera">
            </div>
            <button type="submit" class="btn btn-custom w-100">Submit</button>
        </form>
        
    </div>
    <footer>
        <p>placeholder</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
