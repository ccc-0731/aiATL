<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Repair Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, Arial;
            padding: 18px;
            background: linear-gradient(to bottom, #87ceeb, #ffffff) no-repeat center center fixed;
        }
        .solution-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .solution {
            border: 1px solid #eee;
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .solution-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .solution-meta {
            color: #666;
            font-size: .85rem;
            margin-bottom: 8px;
        }
        .solution-steps {
            list-style-position: inside;
            padding-left: 0;
        }
        .solution-step {
            margin: 8px 0;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-primary {
            background: #0b84ff;
            color: #fff;
            border: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            color: #dc3545;
            padding: 10px;
            border-radius: 4px;
            background: #ffe5e5;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        {% for answer in answers%}
            <p>{{answer}}</p>
        {%endfor%}
    </div>

</body>
</html>
