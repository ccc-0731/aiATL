<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Repair Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, Arial;
            padding: 18px;
            background: linear-gradient(to bottom, #87ceeb, #ffffff) no-repeat center center fixed;
        }
        .solution-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .solution {
            border: 1px solid #eee;
            padding: 16px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .solution-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .solution-meta {
            color: #666;
            font-size: .85rem;
            margin-bottom: 8px;
        }
        .solution-steps {
            list-style-position: inside;
            padding-left: 0;
        }
        .solution-step {
            margin: 8px 0;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-primary {
            background: #0b84ff;
            color: #fff;
            border: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error {
            color: #dc3545;
            padding: 10px;
            border-radius: 4px;
            background: #ffe5e5;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Repair Solutions</h2>
        <div id="solutions" class="solution-container">
            <div class="loading">Loading solutions...</div>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="/" class="btn btn-secondary">Back to Start</a>
            <button onclick="refreshSolutions()" class="btn btn-primary">Refresh Solutions</button>
        </div>
        {% for answer in answers%}
            <p>{{answer}}</p>
        {%endfor%}
    </div>

    <script>
        const SOLUTIONS_URL = '/solutions';  // GET endpoint for fetching solutions

        async function fetchSolutions() {
            const container = document.getElementById('solutions');

            try {
                const res = await fetch(SOLUTIONS_URL, {cache: 'no-store'});
                if (!res.ok) throw new Error('Server response ' + res.status);
                const data = await res.json();

                if (!data || (!data.solutions && !data.error)) {
                    container.innerHTML = '<div class="loading">No solutions available yet. Please check back after answering all questions.</div>';
                    return;
                }

                if (data.error) {
                    container.innerHTML = `<div class="error">${escapeHtml(data.error)}</div>`;
                    return;
                }

                // Render solutions
                container.innerHTML = data.solutions.map(solution => `
                    <div class="solution">
                        <div class="solution-title">${escapeHtml(solution.title)}</div>
                        <div class="solution-meta">
                            Difficulty: ${escapeHtml(solution.difficulty || 'N/A')} •
                            Time required: ${escapeHtml(solution.time || 'N/A')}
                        </div>
                        <div class="solution-content">
                            ${solution.description ? `<p>${escapeHtml(solution.description)}</p>` : ''}
                            ${solution.steps ? `
                                <ol class="solution-steps">
                                    ${solution.steps.map(step => `
                                        <li class="solution-step">${escapeHtml(step)}</li>
                                    `).join('')}
                                </ol>
                            ` : ''}
                        </div>
                        ${solution.url ? `
                            <div class="mt-3">
                                <a href="${escapeHtml(solution.url)}" target="_blank" class="btn btn-primary btn-sm">
                                    View Full Guide
                                </a>
                            </div>
                        ` : ''}
                    </div>
                `).join('') || '<div class="loading">No solutions found</div>';

            } catch (err) {
                console.error('fetchSolutions error', err);
                container.innerHTML = `
                    <div class="error">
                        Failed to load solutions: ${escapeHtml(err.message)}
                    </div>
                `;
            }
        }

        function escapeHtml(s) {
            return s ? s.replace(/[&<>"]/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;'
            }[c])) : '';
        }

        function refreshSolutions() {
            const container = document.getElementById('solutions');
            container.innerHTML = '<div class="loading">Refreshing solutions...</div>';
            fetchSolutions();
        }

        // Initial load
        fetchSolutions();

        // Poll for updates every 10 seconds
        setInterval(fetchSolutions, 10000);
    </script>
</body>
</html>
