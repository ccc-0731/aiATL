<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Upload</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../static/style.css" />
</head>

<body class="lightmode">
  <div class="container" id="upload">
    <h1>Welcome back, username!</h1>
    <h2>What's going wrong? We can help.</h2>

    <form action="/upload_image" method="POST" enctype="multipart/form-data" class="mt-4" onsubmit="showBear()">
      <div class="mb-3">
        <label for="image_input" class="form-label">Upload Image(s):</label>
        <input
          id="image_input"
          type="file"
          name="image_input"
          class="form-control"
          accept="image/*"
          capture="camera"
          multiple
        />
      </div>

      <div class="button-row mt-4">
        <a href="/logout" class="btn btn-danger">Logout</a>
        <input type="submit" value="Submit" class="btn btn-custom" />
      </div>
    </form>
  </div>

  <!-- ====== Bear Loading GIF (static/images) ====== -->
<div id="bearLoading" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:black;
  z-index:9999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
">
  <img src="{{ url_for('static', filename='images/BearLoading.gif') }}" alt="Bear Loading Animation" style="width:300px;">
  <h2 style="margin-top:20px; color:#333; font-family:system-ui, sans-serif;">
    Processing your submission...
  </h2>
</div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  function showBear() {
    // hide your upload form container
    document.getElementById("upload").style.display = "none";
    // show the bear loading screen
    document.getElementById("bearLoading").style.display = "flex";
    // allow the form to submit normally
    return true;
  }
</script>

</body>
</html>
