<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="lightmode">
    <div class="container">
        <h1>Welcome back, username!</h1>
        <h2>What's going wrong? We can help.</h2>

        <form action="/solution" method="POST" enctype="multipart/form-data" class="mt-4" onsubmit="showBear(event)">
            <div class="mb-3">
                <label for="image_input" class="form-label">Upload Image(s):</label>
                <input id="image_input" type="file" name="image_input" class="form-control" accept="image/*" capture="camera" multiple>
            </div>

            {% for question in testQuestions %}
            <label for="questions" class="form-label">{{question}}</label>
            <input id="questions" type="text" name="image_input" class="form-control" accept="image/*" capture="camera" multiple>
            {% endfor %}

            <!-- Buttons aligned at bottom -->
            <div class="d-flex justify-content-between mt-4">
                <a href="/logout" class="btn btn-danger">Logout</a>
                <input type="submit" value="Submit">

            </div>
        </form>
    </div>


    <div id="questions"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const QUESTIONS_URL = '/questions';    // GET -> [{id,text,...}]
        const ANSWER_URL = '/answers';         // POST -> { question_id, answer }

        const container = document.getElementById('questions');
        let seenIds = new Set();

        function renderQuestions(list){
            if (!list || list.length === 0) { //just in case
                container.innerHTML = '<p>No questions right now.</p>';
                return;
            }
            // Render newest first
            container.innerHTML = '';
            document.querySelector(".container").style.display = "none"; // hide the upload form

            list.forEach(q => {
                const div = document.createElement('div');
                div.className = 'question';
                div.dataset.qid = q.id;
                div.innerHTML = `
                    <div class="meta">#${q.id} • ${q.asked_by || 'AI'} • ${new Date(q.created_at).toLocaleString()}</div>
                    <div class="text" style="margin-top:6px">${escapeHtml(q.text)}</div>
                    <div style="margin-top:8px">
                        <textarea placeholder="Type your answer..." data-qid="${q.id}"></textarea>
                        <div style="margin-top:8px;display:flex;gap:8px">
                            <button class="btn btn-custom submit" data-qid="${q.id}">Submit answer</button>
                        </div>
                        <div class="status" style="margin-top:8px;color:#0a0"></div>
                    </div>
                `;
                container.appendChild(div);
            });
            // Hook up submit listeners
            Array.from(container.querySelectorAll('.submit')).forEach(button => {
                button.addEventListener('click', onSubmit);
            });
        }

        async function fetchQuestions(){
            try {
                const res = await fetch(QUESTIONS_URL, {cache: 'no-store'});
                if (!res.ok) throw new Error('Server response '+res.status);
                const list = await res.json();
                // Simple dedupe: only re-render if new id appears
                const ids = new Set(list.map(q => q.id));
                const isNew = Array.from(ids).some(id => !seenIds.has(id));
                if (isNew) {
                    list.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
                    renderQuestions(list);
                    seenIds = ids;
                }
            } catch (err) {
                console.error('fetchQuestions error', err);
                // Optionally show error state in UI
            }
        }

        async function onSubmit(ev){
            document.getElementById("bearLoading").style.display = "flex";
            const qid = ev.currentTarget.dataset.qid;
            const textarea = container.querySelector(`textarea[data-qid="${qid}"]`);
            const answer = textarea.value.trim();
            if (!answer) { alert('Please type an answer'); return; }
            const payload = { question_id: qid, answer };
            try {
                const res = await fetch(ANSWER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error(await res.text());
                const body = await res.json();
                const statusEl = container.querySelector(`.question[data-qid="${qid}"] .status`);
                statusEl.textContent = 'Answer saved';
                textarea.value = '';
            } catch (err) {
                alert('Failed to submit answer: ' + err.message);
            }
        }

        function escapeHtml(s){
            return s ? s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) : '';
        }

    // Start polling
    fetchQuestions();
    setInterval(fetchQuestions, 5000); // poll every 5s

    function showBear(event) {
  // prevent immediate navigation
  event.preventDefault();

  // hide the form
  document.querySelector(".container").style.display = "none";
  // show the bear overlay
  document.getElementById("bearLoading").style.display = "flex";

  // allow the browser to render the overlay, then continue submission
  setTimeout(() => event.target.submit(), 50); // 50–100 ms is enough
}



    </script>
    <div id="bearLoading" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:white;
  z-index:9999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
">
  <img src="{{ url_for('static', filename='images/BearLoading.gif') }}" alt="Bear Loading Animation" style="width:300px;">
  <h2 style="margin-top:20px; color:#333; font-family:system-ui, sans-serif;">
    Processing your submission...
  </h2>
</div>
<script src="../static/theme_toggle.js"></script>
</body>
</html>
