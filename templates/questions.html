<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="lightmode">
    <div class="container">
        <h1>Welcome back, username!</h1>
        <h2>What's going wrong? We can help.</h2>

        <form action="/solution" method="POST" enctype="multipart/form-data" class="mt-4" onsubmit="showBear(event)">
         
          {% for question in testQuestions %}
            <label for="questions" class="form-label">{{question}}</label>
            <input id="questions" type="text" name="image_input" class="form-control" accept="image/*" capture="camera" multiple>
            {% endfor %}    
           
            <!-- Buttons aligned at bottom -->
            <div class="d-flex justify-content-between mt-4">
                <a href="/logout" class="btn btn-danger">Logout</a>
                <input type="submit" value="Submit">

            </div>
        </form>
    </div>


    <div id="questions"></div>

    <!-- ====== Bear Loading GIF (static/images) ====== -->
<!-- ====== Bear Loading GIF (static/images) ====== -->
<div id="bearLoading">
  <picture>
    <source srcset="{{ url_for('static', filename='images/invertedBearLoading.gif') }}" media="(prefers-color-scheme: dark)">
    <img id="bearGif" src="{{ url_for('static', filename='images/BearLoading.gif') }}" alt="Bear Loading Animation">
  </picture>
  <h2 id="bearText">Processing your submission...</h2>
</div>

<style>
  /* Base layout for the loading overlay */
  #bearLoading {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    transition: background-color 0.3s ease, color 0.3s ease;
    background-color: var(--bear-bg);
  }

  #bearGif {
    width: 300px;
  }

  #bearText {
    margin-top: 20px;
    font-family: system-ui, sans-serif;
    transition: color 0.3s ease;
  }

  /* Light mode variables */
  body.lightmode {
    --bear-bg: white;
    --bear-text: #333;
  }

  /* Dark mode variables */
  body.darkmode {
    --bear-bg: black;
    --bear-text: white;
  }

  /* Apply theme colors dynamically */
  #bearLoading {
    background-color: var(--bear-bg);
  }

  #bearText {
    color: var(--bear-text);
  }
</style>
<script>
function showBear(event) {
  // prevent immediate navigation
  event.preventDefault();

  // hide the form
  document.querySelector(".container").style.display = "none";

  // show the bear overlay
  const bear = document.getElementById("bearLoading");
  const bearText = document.getElementById("bearText");
  bearText.textContent = "Processing your submission...";
  bear.style.display = "flex";

  // continue form submission
  setTimeout(() => event.target.submit(), 50);
}

// optional: show loading bear while waiting for questions
window.addEventListener("load", () => {
  const bear = document.getElementById("bearLoading");
  const bearText = document.getElementById("bearText");
  bearText.textContent = "Loading your questions...";
  bear.style.display = "flex";

  // hide bear once questions load (adjust if you have fetch logic)
  setTimeout(() => bear.style.display = "none", 1200);
});
</script>


<script src="../static/theme_toggle.js"></script>
</body>
</html>
