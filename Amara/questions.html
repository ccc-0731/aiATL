<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #87ceeb, #ffffff) no-repeat center center fixed; /* Sky blue to white gradient */
            background-size: cover;
            color: #333;
            font-family: 'Arial', sans-serif;
        }
        .container {
            margin-top: 5%;
            background: rgba(255, 250, 210, 0.9); /* Soft pastel yellow, resembling sunny vibes */
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1, h2 {
            font-family: 'Helvetica', sans-serif;
            font-weight: bold;
            text-align: center;
        }
        h1 {
            color: #fbb034; /* Golden retriever fur-inspired orange */
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        h2 {
            color: #228b22; /* Deep green to evoke nature */
        }
        .task-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .task-list li {
            background: #f8f9fa;
            margin-bottom: 10px;
            padding: 10px;
            border-left: 5px solid #fbb034;
            border-radius: 5px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            background-color: #fbb034;
            border: none;
            color: white;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn-custom:hover {
            background-color: #ffa72b;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-secondary {
            background-color: #228b22;
            border: none;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task List</h1>
        <h2>Welcome back, {{ username }}!</h2>
        <div class="task-list">
            <ol class="list-group list-group-numbered">
                {% for item in task_list %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ item }}
                    </li>
                {% endfor %}
            </ol>
        </div>
        <form action="/add_task" method="POST" class="mt-4">
            <div class="mb-3">
                <label for="item_input" class="form-label">Add Task:</label>
                <input id="item_input" type="text" name="item_input" class="form-control" placeholder="Enter a new task">
            </div>
            <button type="submit" class="btn btn-custom w-100">Add Task</button>
        </form>
        <form action="/delete_task" method="POST" class="mt-4">
            <div class="mb-3">
                <label for="item_remove" class="form-label">Remove Task:</label>
                <select id="item_remove" name="item_remove" class="form-select">
                    {% for item in task_list %}
                        <option value="{{ item }}">{{ item }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-danger w-100">Delete Task</button>
        </form>
        <form action="/logout" class="mt-4">
            <button type="submit" class="btn btn-secondary w-100">Logout</button>
        </form>
    </div>
    <footer>
        <p>Stay positive and tackle your tasks, just like a golden retriever tackles a game of fetch! 🐾</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
